name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches manifest.json
        run: |
          version=$(python -c "import json;print(json.load(open('custom_components/evse_charging_cost/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "manifest.json says $version but the tag is $tag"
            exit 1
          fi

      - name: Build the install archive
        run: |
          cd custom_components/evse_charging_cost
          zip -qr ../../evse_charging_cost.zip .

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: evse_charging_cost.zip
